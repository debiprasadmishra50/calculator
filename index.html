<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A premium modern calculator" />
    <title>Calc — Modern Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <main class="calc-card">
      <header class="calc-header">
        <div class="brand">
          <div class="brand-dot"></div>
          <span class="brand-name">Calc</span>
        </div>
        <span class="keyboard-hint">Keyboard supported</span>
      </header>

      <section class="display-area" aria-label="Calculator display">
        <div class="display-expression" id="expr" aria-live="polite"></div>
        <div class="display-result" id="result" aria-live="assertive">0</div>
      </section>

      <section class="keypad" aria-label="Calculator keypad">
        <div class="keypad-row">
          <button class="btn-calc btn-ghost" data-action="clear" aria-label="Clear">C</button>
          <button class="btn-calc btn-ghost" data-action="backspace" aria-label="Backspace">⌫</button>
          <button class="btn-calc btn-ghost" data-action="percent" aria-label="Percent">%</button>
          <button class="btn-calc btn-op" data-action="divide" aria-label="Divide">/</button>
        </div>
        <div class="keypad-row">
          <button class="btn-calc" data-value="7" aria-label="Seven">7</button>
          <button class="btn-calc" data-value="8" aria-label="Eight">8</button>
          <button class="btn-calc" data-value="9" aria-label="Nine">9</button>
          <button class="btn-calc btn-op" data-action="multiply" aria-label="Multiply">×</button>
        </div>
        <div class="keypad-row">
          <button class="btn-calc" data-value="4" aria-label="Four">4</button>
          <button class="btn-calc" data-value="5" aria-label="Five">5</button>
          <button class="btn-calc" data-value="6" aria-label="Six">6</button>
          <button class="btn-calc btn-op" data-action="subtract" aria-label="Subtract">−</button>
        </div>
        <div class="keypad-row">
          <button class="btn-calc" data-value="1" aria-label="One">1</button>
          <button class="btn-calc" data-value="2" aria-label="Two">2</button>
          <button class="btn-calc" data-value="3" aria-label="Three">3</button>
          <button class="btn-calc btn-op" data-action="add" aria-label="Add">+</button>
        </div>
        <div class="keypad-row last-row">
          <button class="btn-calc" data-value="00" aria-label="Double zero">00</button>
          <button class="btn-calc" data-value="0" aria-label="Zero">0</button>
          <button class="btn-calc" data-value="." aria-label="Decimal">.</button>
          <button class="btn-calc btn-eq" data-action="equals" aria-label="Equals">=</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <a href="https://www.debiprasadmishra.net" target="_blank" rel="noopener noreferrer"
        >Made with ❤️ by © Debi Prasad Mishra</a
      >
    </footer>
  </body>
</html>
